<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Phân Trang Xe Tăng WW2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 8px;
            border-bottom: 1px solid #ccc;
        }

        button {
            margin: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .active {
            background: #007bff;
            color: white;
        }
    </style>
</head>
<body>

<h2>Danh sách 50 xe tăng Thế chiến II</h2>

<ul id="list"></ul>

<div id="pagination"></div>

<script>
const danhSach = [
    "Tiger I",
    "Tiger II (King Tiger)",
    "Panther",
    "Panzer IV",
    "Panzer III",
    "StuG III",
    "Jagdpanther",
    "JagdTiger",
    "Elefant",
    "Maus",
    "IS-2",
    "IS-1",
    "KV-1",
    "KV-2",
    "T-34",
    "T-34-85",
    "SU-85",
    "SU-100",
    "SU-152",
    "ISU-152",
    "M4 Sherman",
    "M4A3E8 Sherman",
    "M26 Pershing",
    "M3 Lee",
    "M10 Wolverine",
    "M18 Hellcat",
    "M36 Jackson",
    "Churchill",
    "Cromwell",
    "Comet",
    "Matilda II",
    "Valentine",
    "Crusader",
    "A30 Challenger",
    "Char B1",
    "Somua S35",
    "Renault R35",
    "Hotchkiss H39",
    "Type 95 Ha-Go",
    "Type 97 Chi-Ha",
    "Type 1 Chi-He",
    "Type 3 Chi-Nu",
    "Semovente 75/18",
    "Carro Armato M13/40",
    "Turán I",
    "Turán II",
    "LT vz.38",
    "Hetzer",
    "Toldi I",
    "38M Nimród"
];

const soMucMoiTrang = 10;
const tongTrang = Math.ceil(danhSach.length / soMucMoiTrang);

function hienThiTrang(trang) {
    const list = document.getElementById("list");
    list.innerHTML = "";

    const batDau = (trang - 1) * soMucMoiTrang;
    const ketThuc = batDau + soMucMoiTrang;

    for (let i = batDau; i < ketThuc && i < danhSach.length; i++) {
        const li = document.createElement("li");
        li.textContent = danhSach[i];
        list.appendChild(li);
    }

    const buttons = document.querySelectorAll("#pagination button");
    buttons.forEach(btn => btn.classList.remove("active"));
    buttons[trang - 1].classList.add("active");
}

const pagination = document.getElementById("pagination");

for (let i = 1; i <= tongTrang; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;

    btn.addEventListener("click", function () {
        hienThiTrang(i);
    });

    pagination.appendChild(btn);
}

hienThiTrang(1);
</script>

</body>
</html>
